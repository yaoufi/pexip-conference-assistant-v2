services:
  pexip-assistant:
    build:
      context: .
      args:
        BASE_PATH: /assistant
    container_name: pexip-assistant-app
    ports:
      - "127.0.0.1:3002:3001"
    environment:
      - BASE_PATH=/assistant
    volumes:
      # Setup GUI writes config.json + oauth2_private_key.pem here; keep it outside
      # the image so rebuilds don't wipe the configuration. Must be owned by uid 1000.
      - ./data:/app/data
    restart: always
    mem_limit: 512m
    cpus: '1.0'
